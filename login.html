<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录账户 · ClearMaas API-Pro</title>
    <link rel="stylesheet" href="maas-page.css?v=refine-6" />
  </head>
  <body>
    <main class="close-auth-page">
      <section class="close-auth-card">
        <a class="close-logo" href="shouye.html" aria-label="ClearMaas API-Pro">
          <span class="close-logo-symbol"><b>CM</b></span>
          <span class="close-logo-text">Clear<span>Maas</span></span>
        </a>
        <p class="close-auth-subtitle">
          企业级 OpenAI 接口服务，全球任意位置高速稳定接入
        </p>

        <form class="close-auth-form" data-auth-form>
          <label class="close-field">
            <span class="close-field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M20 21a8 8 0 0 0-16 0"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" placeholder="邮箱" />
          </label>
          <label class="close-field">
            <span class="close-field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input data-password-input type="password" placeholder="密码" />
            <button
              class="close-eye"
              type="button"
              aria-label="显示密码"
              data-password-toggle
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                ></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </label>

          <div class="close-form-links">
            <a href="#">忘记密码</a>
            <a href="regist.html">邮箱注册</a>
          </div>

          <label class="close-terms">
            <input type="checkbox" data-auth-check />
            <span
              >我已阅读并同意<a href="#">《服务条款》</a>和<a href="#"
                >《隐私政策》</a
              ></span
            >
          </label>

          <button
            class="close-submit close-submit-disabled"
            type="button"
            data-auth-submit
            disabled
          >
            登 录
          </button>
        </form>

        <div class="close-divider"><span>其他登录方式</span></div>
      </section>

      <footer class="close-auth-footer">
        © 2026 ClearMaas 企业级大模型API代理平台
      </footer>
    </main>
    <script>
      const form = document.querySelector("[data-auth-form]");
      const check = form?.querySelector("[data-auth-check]");
      const submit = form?.querySelector("[data-auth-submit]");
      check?.addEventListener("change", () => {
        submit.disabled = !check.checked;
        submit.classList.toggle("close-submit-disabled", !check.checked);
      });
      document
        .querySelector("[data-password-toggle]")
        ?.addEventListener("click", (event) => {
          const input = document.querySelector("[data-password-input]");
          const visible = input.type === "text";
          input.type = visible ? "password" : "text";
          event.currentTarget.setAttribute(
            "aria-label",
            visible ? "显示密码" : "隐藏密码",
          );
        });
    </script>
  </body>
</html>
